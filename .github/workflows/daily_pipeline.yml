name: Daily Sport Analyst Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Commit generated outputs
        run: |
          git config user.name "sport-analyst-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports predictions backtests models || true
          git diff --cached --quiet || git commit -m "Update sport analyst data"
          git push
